<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="orbitBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1438" />
      <stop offset="100%" stop-color="#0B0914" />
    </linearGradient>
    <linearGradient id="orbitGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DDD6FE" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>
    <radialGradient id="centerOrb" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#EDE9FE" />
      <stop offset="45%" stop-color="#A78BFA" />
      <stop offset="85%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#5B21B6" />
    </radialGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#8B5CF6" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Container tile with rounded corners and refined violet border -->
  <rect x="1" y="1" width="30" height="30" rx="7" fill="url(#orbitBg)" stroke="#8B5CF6" stroke-width="1.5" stroke-opacity="0.75" />

  <!-- Lucide Orbit geometry with glowing gradient and nodes -->
  <g transform="translate(4, 4)">
    <path d="M20.341 6.484A10 10 0 0 1 10.266 21.85" stroke="url(#orbitGlow)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M3.659 17.516A10 10 0 0 1 13.74 2.152" stroke="url(#orbitGlow)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="12" cy="12" r="3.2" fill="url(#centerOrb)" />
    <circle cx="19" cy="5" r="2.2" fill="#DDD6FE" />
    <circle cx="5" cy="19" r="2.2" fill="#A78BFA" />
  </g>
</svg>